# org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC -XX:+UnlockExperimentalVMOptions -XX:G1NewSizePercent=20 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options = -Xmx1g
kotlin.compiler.execution.strategy = daemon
# org.gradle.workers.isolation.default=none

android.enableJetifier=false
android.nonFinalResIds=true
android.nonTransitiveRClass=true
android.useAndroidX=true

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=false
org.gradle.workers.max=2

kotlin_version=2.4.0
krdb_version=3.3.4

android.dependency.useConstraints=false

# android.r8.enablePartitionMapOutput=true


android.enableR8.fullMode=false

# === shiroikuma-kuchusen fork ===
# VERSION_NAME / VERSION_CODE track upstream (XilinJia/Podcini.A).
# BUILD_NUMBER is our fork increment, bumped on every build; reset to 1 on each new upstream version.
# Fork versionName = "<VERSION_NAME>+<BUILD_NUMBER padded to 3 digits>" (e.g. 12.6.1+001),
# versionCode = VERSION_CODE * 10000 + BUILD_NUMBER (plain integer — the padding is text only).
VERSION_NAME=12.6.1
VERSION_CODE=102
BUILD_NUMBER=2
# Installed package id for our fork (kept distinct so it coexists with upstream Podcini.A).
# The code namespace stays ac.mdiq.podcini (set in app/build.gradle.kts) so sources/R/BuildConfig are unchanged.
APP_ID=shiroikuma.kuchusen

